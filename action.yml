name: Generic Helm Pack and Push to Private ECR
description: Pack Helm chart and push it to private Amazon ECR

inputs:
  ECR_ID:
    description: AWS Access Key ID del usuario de CI/CD
    required: true

  ECR_PASSWORD:
    description: AWS Secret Access Key del usuario de CI/CD
    required: true

  ECR_FULLNAME:
    description: Registry privado, por ejemplo 240229583996.dkr.ecr.us-east-1.amazonaws.com
    required: true

  AWS_REGION:
    description: Región de AWS donde está ECR
    required: false
    default: us-east-1

  appName:
    description: "Nombre de la aplicacion (dentro del proyecto)"
    required: true
  namespace:
    description: "Nombre de namespace"
    required: false
    default: ""
  teamProject:
    description: "Nombre del proyecto/equipo"
    required: true
  appVersion:
    description: "Tag para subir imagen"
    required: true
  helmChartVersionLatest:
    description: Versión del chart Helm
    required: true

runs:
  using: composite

  steps:
    - run: echo 'Inicia el proceso'
      shell: bash
      
    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.12.3 #Helm 13 tiene un bug
      
    - name: Reviso archivos y version helm
      shell: bash
      run: |-
          ls
          helm version --short

    - name: Descargar artefacto de values
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.appName }}-${{ inputs.namespace }}

  # Verifica helm por errores (deberia ser bloqueante). Revisar este paso con un Json para asegurar que esté correcto.
    - name: Helm Lint 
      shell: bash
      run: |
        set -euo pipefail
        helm lint --values values.yaml .

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.ECR_ID }}
        aws-secret-access-key: ${{ inputs.ECR_PASSWORD }}
        aws-region: ${{ inputs.AWS_REGION }}

    - name: Helm Package and Push to Private ECR
      shell: bash
      env:
        AWS_REGION: ${{ inputs.AWS_REGION }}
        ECR_FULLNAME: ${{ inputs.ECR_FULLNAME }}
        REPOSITORY_NAME: ${{ inputs.teamProject }}-${{ inputs.appName }}
        HELM_VERSION: ${{ inputs.helmChartVersionLatest }}
        APP_VERSION: ${{ inputs.appVersion }}
      run: |
        set -euo pipefail

        echo "Identidad AWS:"
        aws sts get-caller-identity

        echo "Validando repositorio privado: $REPOSITORY_NAME"

        if aws ecr describe-repositories \
          --repository-names "$REPOSITORY_NAME" \
          --region "$AWS_REGION" >/dev/null 2>&1; then
          echo "Repositorio privado existente."
        else
          echo "Creando repositorio privado."
          aws ecr create-repository \
            --repository-name "$REPOSITORY_NAME" \
            --region "$AWS_REGION" \
            --image-scanning-configuration scanOnPush=true
        fi

        echo "Login en ECR privado: $ECR_FULLNAME"
        aws ecr get-login-password --region "$AWS_REGION" |
          helm registry login \
            "$ECR_FULLNAME" \
            --username AWS \
            --password-stdin

        PACKAGE_DIR="$(mktemp -d)"

        helm package . \
          --destination "$PACKAGE_DIR" \
          --version "$HELM_VERSION" \
          --app-version "$APP_VERSION"

        CHART_PACKAGE="$(find "$PACKAGE_DIR" -maxdepth 1 -name '*.tgz' -type f -print -quit)"

        if [[ -z "$CHART_PACKAGE" ]]; then
          echo "ERROR: no se generó ningún paquete Helm .tgz"
          exit 1
        fi

        echo "Publicando chart: $CHART_PACKAGE"
        echo "Destino: oci://$ECR_FULLNAME/helm"

        helm push "$CHART_PACKAGE" "oci://$ECR_FULLNAME/helm"
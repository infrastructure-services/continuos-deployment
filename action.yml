name: 'Generate values.yaml'
description: 'Action to generate values.yaml file from .devops values-env.yaml file and repository variables for eks manifiests'
inputs:

  CERTIFICATE:
    description: "Certificado para el dominio"
    required: false
    default: ""
  CA_CERTIFICATE:
    description: "Certificado de la CA"
    required: false
    default: ""
  KEY_CERTIFICATE:
    description: "Certificado Key"
    required: false
    default: ""
    
  GITHUB_HELMREPO_TOKEN:
    description: "Token para descargar el codigo de templates HELM"
    required: true
  helmRepo:
    description: "Repositorio de helm"
    required: false
    default: "infrastructure-services/manifiestos-cd"
  helmRepoRef:
    description: "Ref del repositorio de Helm"
    required: false
    default: "standard"
    
  appName:
    description: "Nombre de la aplicacion (dentro del proyecto)"
    required: true
  namespace:
    description: "nombre de namespace"
    required: false
    default: ""
  ROLE_ARN:
    description: "URI del ROL ARN"
    required: false
    default: "arn:aws:iam::654654346384:policy/HopEnviosSQSAccessPolicy"
    
  clusterFqdn:
     description: "FQDN para pasarle a helm"
     required: true
  fileValuesPath:
    description: "path archivo de values.yaml"
    required: true
  teamProject:
    description: "Nombre del proyecto/equipo"
    required: true
    
  cpuLimit:
    description: "Limite de CPU del pod"
    required: false
    default: "1"
  memLimit:
    description: "Limite de Memoria del Pod"
    required: false
    default: "1Gi"
  cpuRequest:
    description: "Request de CPU del pod"
    required: false
    default: "150m"
  memRequest:
    description: "Request de Memoria del Pod"
    required: false
    default: "200Mi"
    
runs:
  using: "composite"
  steps:
    - run: echo '🎁Generate values.yaml'
      shell: bash

    - name: Install Helm
      uses: azure/setup-helm@v3
      with:
        version: v3.12.3 #Helm 13 tiene un bug (5/11/2024 Hay que chequear si todavía está)
        
    - name: checkout codigo
      uses: actions/checkout@v6

    - name: Copy values.yaml
      shell: bash
      run: |-
          ls ../
          cp ${{ inputs.fileValuesPath }} ../values.yaml

    - name: Checkout code helm templates
      uses: actions/checkout@v6
      with:
        repository: ${{ inputs.helmRepo }}
        ref: ${{ inputs.helmRepoRef }}
        token: ${{ inputs.GITHUB_HELMREPO_TOKEN }}
    
    - name: Restore values.yaml
      shell: bash
      run: cp ../values.yaml values.yaml
    
    - name: Helm customizer le agregan valores al values
      shell: bash
      run: |-
        echo -e 'cluster:\n  fqdn: ${{ inputs.clusterFqdn}}' >> values.yaml
        ls
        echo 'namespace: ${{inputs.namespace}}' >> values.yaml
        echo 'projectName: ${{inputs.teamProject}}' >> values.yaml
        echo 'appname: ${{inputs.appName}}' >> values.yaml
        echo 'cpulimit: ${{inputs.cpuLimit}}' >> values.yaml
        echo 'memlimit: ${{inputs.memLimit}}' >> values.yaml
        echo 'cpurequest: ${{inputs.cpuRequest}}' >> values.yaml
        echo 'memrequest: ${{inputs.memRequest}}' >> values.yaml
        echo 'ROLE_ARN: ${{inputs.ROLE_ARN}}' >> values.yaml
        echo 'caCertificate: |' >> values.yaml
        echo -e "${{inputs.CA_CERTIFICATE}}" | sed 's/^/    /' >> values.yaml
        echo 'certificate: |' >> values.yaml
        echo -e "${{inputs.CERTIFICATE}}" | sed 's/^/    /' >> values.yaml
        echo 'key: |' >> values.yaml
        echo -e "${{inputs.KEY_CERTIFICATE}}" |  sed 's/^/    /' >> values.yaml
        echo 'name: ${{inputs.teamProject}}-${{inputs.appName}}' >> Chart.yaml
        
    - name: show values
      shell: bash
      run: cat values.yaml

    - name: show Chart
      shell: bash
      run: cat Chart.yaml
      
    - name: Validate Resulting values.yaml
      shell: bash
      run: |
        #Validando values.yaml
        if ! command -v yq >/dev/null 2>&1; then
          echo "ERROR: falta instalar yq en el Runner - Contactar a DevOps"
          echo "Requiere yq v4: https://github.com/mikefarah/yq"
          exit 2
        fi

        validate_file() {
          local file="values.yaml"
          local has_errors=0
          local tmp_dir

          if [[ ! -f "$file" ]]; then
            echo "ERROR: no existe el archivo: $file"
            return 1
          fi

          if ! yq e '.' "$file" >/dev/null 2>&1; then
            echo ":error: YAML inválido - Revisar el formato del values"
            return 1
          fi

          tmp_dir="$(mktemp -d)"

          local normal_keys="$tmp_dir/env_normal.keys"
          local secret_keys="$tmp_dir/env_secret.keys"
          local default_keys="$tmp_dir/env_default.keys"

          : > "$normal_keys"
          : > "$secret_keys"
          : > "$default_keys"

          extract_section_keys() {
            local section="$1"
            local output_file="$2"
            local section_type

            section_type="$(yq e ".$section | type" "$file" 2>/dev/null || echo "!!null")"

            if [[ "$section_type" == "!!null" ]]; then
              return 0
            fi

            if [[ "$section_type" != "!!map" ]]; then
              echo "ERROR: $file -> la sección '$section' existe pero no es un mapa clave/valor"
              echo "::error:: Error de variables en '$section' - Revisa el values del ambiente"
              has_errors=1
              return 0
            fi

            yq e -r ".$section | keys | .[]" "$file" > "$output_file"
          }

          validate_internal_duplicates() {
            local section="$1"
            local keys_file="$2"
            local duplicated_keys

            duplicated_keys="$(sort "$keys_file" | uniq -d || true)"

            if [[ -n "$duplicated_keys" ]]; then
              echo "ERROR: $file -> variables duplicadas dentro de '$section':"
              echo "::error:: Se encontraron variables duplicadas dentro de '$section'. Mirar log del wofklow para una lista y revisar el archivo values.yaml para eliminarlas:"
              while IFS= read -r key; do
                [[ -z "$key" ]] && continue
                echo "  - $key"
              done <<< "$duplicated_keys"

              has_errors=1
            fi
          }

          validate_cross_duplicates() {
            local section_a="$1"
            local file_a="$2"
            local section_b="$3"
            local file_b="$4"
            local duplicated_keys

            duplicated_keys="$(comm -12 <(sort -u "$file_a") <(sort -u "$file_b") || true)"

            if [[ -n "$duplicated_keys" ]]; then
              echo "ERROR: $file -> variables duplicadas entre '$section_a' y '$section_b':"
              echo "::error:: Se encontraron variables duplicadas en $section_a. Mirar log del wofklow para una lista y revisar el archivo values.yaml para eliminarlas:"
              while IFS= read -r key; do
                [[ -z "$key" ]] && continue
                echo "  - $key"
              done <<< "$duplicated_keys"

              has_errors=1
            fi
          }

          extract_section_keys "env.normal" "$normal_keys"
          extract_section_keys "env.secret" "$secret_keys"
    

          validate_internal_duplicates "env.normal" "$normal_keys"
          validate_internal_duplicates "env.secret" "$secret_keys"

          validate_cross_duplicates "env.normal" "$normal_keys" "env.secret" "$secret_keys"
          validate_cross_duplicates "env.secret" "$secret_keys" "env_default" "$default_keys"

          rm -rf "$tmp_dir"

          if [[ "$has_errors" -eq 0 ]]; then
            echo "OK: $file no contiene variables duplicadas no permitidas"
          fi

          return "$has_errors"
        }

        global_errors=0
        if ! validate_file "values.yaml"; then
          global_errors=1
        fi
        exit "$global_errors"
        
    - name: Archive values yaml
      uses: actions/upload-artifact@v6
      with:
        name: ${{inputs.appName}}-${{inputs.namespace}}
        overwrite: true
        path: |
          values.yaml
          Chart.yaml
          templates/

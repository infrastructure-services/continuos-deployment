name: 'Helm and Deploy'
description: 'Action to build helm manifests and Deploy with argocd'
inputs:
  # ACR
  ACR_USERNAME:
    description: "user de acr"
    required: true
  ACR_PASSWORD:
    description: "passwrd de acr"
    required: true
  ACR_NAME:
    description: "nommbre del acr"
    required: true
  ACR_FULL_NAME:
    description: "nombre del acr con azurecr.io"
    required: true

  # App
  appName:
    description: "Nombre de la aplicacion (dentro del proyecto)"
    required: true
  appId:
    description: "Id de la aplicacion (dentro del proyecto)"
    required: true
  teamProject:
    description: "Nombre del proyecto/equipo"
    required: true
  appVersion:
    description: "tag para subir imagen"
    required: true
  namespace:
    description: "nombre de namespaces"
    required: false
    default: ""
  environment:
    description: "nombre de environment"
    required: false
    default: "test"

  # Values
  helmRepo:
    description: "Repositorio de helm"
    required: false
    default: "infrastructure-services/manifiestos-cd"
  helmRepoRef:
    description: "Ref del repositorio de Helm"
    required: false
    default: "standard-nocert"
  cpuLimit:
    description: "Limite de CPU del pod"
    required: false
    default: "1"
  memLimit:
    description: "Limite de Memoria del Pod"
    required: false
    default: "1Gi"
  cpuRequest:
    description: "Request de CPU del pod"
    required: false
    default: "20m"
  memRequest:
    description: "Request de Memoria del Pod"
    required: false
    default: "150Mi"
  fileValuesPath:
    description: "path archivo de values.yaml"
    required: true
  GITHUB_HELMREPO_TOKEN:
    description: "Token para descargar el codigo de templates HELM"
    required: true

  # HELM
  helmChartVersionLatest:
    description: "VersionHelm"
    required: true
  clusterFqdn:
     description: "FQDN para pasarle a helm"
     required: true
    
  # ArgoCD
  ARGO_USERNAME:
    description: "usuario de ARgocd"
    required: true
  ARGO_PASSWORD:
    description: "pass de ARgocd"
    required: true
  ARGO_URL:
    description: "url de ARgocd"
    required: true

  # Keyvault
  AZURE_KEYVAULT_NAME:
    description: "Nombre del keyvault"
    required: false
    default: ""
  AZURE_KEYVAULT_TENANT:
    description: "Tenant del keyvault"
    required: false
    default: ""
  AZURE_KEYVAULT_CLIENT_ID:
    description: "Client ID del keyvault"
    required: false
    default: ""
  AZURE_KEYVAULT_SECRET:
    description: "Secret del keyvault"
    required: false
    default: ""
  AZURE_KEYVAULT_PREFIX:
    description: "Prefijo de las variables de la app en keyvault"
    required: false
    default: ""

  # Observabilidad
  APM_SERVER_URL:
    description: "Url de APM"
    required: false
    default: "https://apm-mon.andreani.com"

outputs:
  name_environment: 
    description: "Nombre del environment"
    value: ${{ steps.setOutputs.outputs.environment }}
  url_environment:
    description: "URL del environment"
    value: ${{ steps.setOutputs.outputs.url }}
  manifestId:
    description: "Ide del manifiesto generado"
    value: ${{ steps.register.outputs.manifestId }}
  coreVersion:
    description: "Id de la versión de Core a la que subscribe"
    value: ${{ steps.register.outputs.coreVersion }}
runs:
  using: "composite"
  steps:
      - name: Check Application
        uses: infrastructure-services/continuos-integration@check-if-exists-app
        with:
          gitOpsUrl: "https://github-integration.andreani.com"
        
      - name: Set Outputs
        id: setOutputs
        shell: bash
        run: |
          echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
          echo "url=https://${{ inputs.appName }}-${{ inputs.namespace }}.${{ inputs.clusterFqdn }}" >> $GITHUB_OUTPUT

      - name: Generate helm version
        uses: actions/github-script@v8
        id: helmversion
        with:
          script: |
            let helmChartVersionLatest = "${{ inputs.helmChartVersionLatest }}";
            if (!helmChartVersionLatest.includes('-')) {
                helmChartVersionLatest = helmChartVersionLatest.replace(/\.([^\.]*)$/, '-$1');
            }
            return helmChartVersionLatest
          result-encoding: string
          
      - name: Generate values.yaml
        id: value
        uses: infrastructure-services/continuos-deployment@generate-values
        with:
          appName: ${{ inputs.appName }}
          teamProject: ${{ inputs.teamProject }}
          namespace: ${{ inputs.namespace }}
          clusterFqdn: ${{ inputs.clusterFqdn }}
          fileValuesPath: ${{ inputs.fileValuesPath }}
          GITHUB_HELMREPO_TOKEN: ${{ inputs.GITHUB_HELMREPO_TOKEN }}
          APPS_CERTIFICATE: ${{inputs.APPS_CERTIFICATE }} 
          APPS_CA_CERTIFICATE: ${{inputs.APPS_CA_CERTIFICATE }}
          APPS_KEY_CERTIFICATE: ${{inputs.APPS_KEY_CERTIFICATE }} 
          helmRepoRef: ${{ inputs.helmRepoRef }}
          helmRepo: ${{ inputs.helmRepo }}
          cpuLimit: ${{ inputs.cpuLimit }}
          memLimit: ${{ inputs.memLimit }}
          cpuRequest: ${{ inputs.cpuRequest }}
          memRequest: ${{ inputs.memRequest }}
          AZURE_KEYVAULT_NAME: ${{ inputs.AZURE_KEYVAULT_NAME }}
          AZURE_KEYVAULT_TENANT: ${{ inputs.AZURE_KEYVAULT_TENANT }}
          AZURE_KEYVAULT_CLIENT_ID: ${{ inputs.AZURE_KEYVAULT_CLIENT_ID }}
          AZURE_KEYVAULT_SECRET: ${{ inputs.AZURE_KEYVAULT_SECRET }}
          AZURE_KEYVAULT_PREFIX: ${{ inputs.AZURE_KEYVAULT_PREFIX }}
          APM_SERVER_URL: ${{ inputs.APM_SERVER_URL }}
      
      - name: build paquete helm.
        id: helm
        uses: infrastructure-services/continuos-deployment@pack-helm
        with:
          appName: ${{ inputs.appName }}
          teamProject: ${{ inputs.teamProject }}
          namespace: ${{ inputs.namespace }}
          appVersion: ${{ inputs.appVersion }}
          helmChartVersionLatest: ${{steps.helmversion.outputs.result}}
          ACR_USERNAME: ${{ inputs.ACR_USERNAME }}
          ACR_PASSWORD: ${{ inputs.ACR_PASSWORD }}
          ACR_FULL_NAME: ${{ inputs.ACR_FULL_NAME }}
      # En lugar de desplegar con Argo, simplemente se sucribe a la api
      - name: Register coordinated release
        id: register
        shell: bash
        run: |
          set -euo pipefail

          body=$(jq -n \
            --arg version "${{ inputs.appVersion }}" \
            --arg environment "prod" \
            --arg namespace "${{ inputs.namespace }}" \
            --arg cluster "aks-prod-br" \
            --arg chartVersion "${{steps.helmversion.outputs.result}}" \
            --arg commitSHA "${{ github.sha }}" \
            --arg addedBy "${{ github.actor }}" \
            '{version: $version, environment: $environment, namespace: $namespace, cluster: $cluster, chartVersion: $chartVersion, commitSHA: $commitSHA, addedBy: $addedBy}')

          set +e
          http_code=$(curl -sS -o body.json -w '%{http_code}' \
            -H 'Content-Type: application/json' \
            -H "X-GitHub-Actor: ${{ github.actor }}" \
            -H "X-GitHub-Run-Id: ${{ github.run_id }}" \
            -X POST "https://control-satelites-dms-api-devops-test.apps.ocptest.andreani.com.ar/api/v1/satelites/${{ inputs.appId }}/releases" \
            -d "$body")
          curl_exit=$?
          set -e

          if [[ "$http_code" == "409" ]]; then
            code=$(jq -r '.notifications[0].code // empty' body.json)
            if [[ "$code" == "DMS-003" ]]; then
              echo "No hay una core version Pending para release coordinado. Si se quiere desplegar para la actual usar workflow de Hotfix Deploy." >&2
              cat body.json >&2
              exit 1
            fi
          fi

          if [[ $curl_exit -ne 0 || "$http_code" -lt 200 || "$http_code" -ge 300 ]]; then
            echo "Error registrando release coordinado (HTTP $http_code)" >&2
            cat body.json >&2
            exit 1
          fi

          manifest_id=$(jq -r '.manifestId // .content.manifestId' body.json)
          core_version=$(jq -r '.coreVersion // .content.coreVersion' body.json)

          echo "manifestId=$manifest_id" >> "$GITHUB_OUTPUT"
          echo "coreVersion=$core_version" >> "$GITHUB_OUTPUT"

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Release coordinado registrado"
            echo "- ManifestId: ${{ steps.register.outputs.manifestId }}"
            echo "- El satelite saldra con DMS Core ${{ steps.register.outputs.coreVersion }}"
            echo "- Re-ejecutable: la API maneja idempotencia en target/chart/manifest"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Deploy Suscripto 🚀
        id: infosubscribe
        shell: bash
        run: |
          echo "  appName: ${{ inputs.appName }}"
          echo "  teamProject: ${{ inputs.teamProject }}"
          echo "  namespace: ${{ inputs.namespace }}"
          echo "  appVersion: ${{ inputs.appVersion }}"
          echo "  helmChartVersionLatest: ${{steps.helmversion.outputs.result}}"
          echo "  environment: ${{ inputs.environment }}"
          
      - name: Cleanup Artifact
        uses: geekyeggo/delete-artifact@v6
        with:
          name: ${{inputs.appName}}-${{inputs.namespace}}



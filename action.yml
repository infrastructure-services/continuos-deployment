name: 'Despliegue y Sincronizacion con ArgoCD de conjunto de satélites'

inputs:
  ACR_USERNAME:
    description: "user de acr"
    required: true
  ACR_PASSWORD:
    description: "passwrd de acr"
    required: true
  ACR_NAME:
    description: "nommbre del acr"
    required: true
  ACR_FULL_NAME:
    description: "nombre del acr con azurecr.io"
    required: true
  ARGO_USERNAME:
    description: "usuario de ArgoCD"
    required: true
  ARGO_PASSWORD:
    description: "pass de ArgoCD"
    required: true
  ARGO_URL:
    description: "url de ArgoCD"
    required: true

runs:
  using: "composite"
  steps:
      - name: Obtener lista de satelites a desplegar
        id: listaApps
        shell: bash
        run: |
          echo 'Obteniendo lista de apps a desplegar'
        # Por motivo de Testing esto está hardcodeado, luego se obtendrá el json desde una api.8        
        # Se intentan varias veces los pasos para evitar fallos si el ArgoCD no responde a tiempo
      - name: Login ArgoCD
        shell: bash
        run: |-
          echo 'login a argocd'
          echo '${{ inputs.ACR_PASSWORD }}' | helm registry login ${{ inputs.ACR_FULL_NAME }} --username ${{ inputs.ACR_USERNAME }} --password-stdin
          variableOk=0
          argoCommand="argocd login --username ${{ inputs.ARGO_USERNAME }} --password ${{ inputs.ARGO_PASSWORD }} --insecure ${{ inputs.ARGO_URL }} --grpc-web --skip-test-tls"
          for i in {1..5}
          do
          if eval "$argoCommand"; then
              echo "ArgoCD login OK"
              variableOk=1
              break
             else
               echo "ArgoCD login $i/5"
               sleep 40
             fi
          done
          if [[ $variableOk != "1" ]]
          then
              echo "Error en ArgoCD Login" >&2;
              exit 1
          fi

      - name: Create Projects and Apps
        shell: bash
        run: |
          LISTA_APPS='{"1":{"appName":"satelite1-api","teamProject":"devops","environment":"prod","appVersion":"1.0.0-1","helmChartVersionLatest":"1.0.0-1.prod","namespace":"devops-prod"},"2":{"appName":"satelite2-api","teamProject":"devops","environment":"prod","appVersion":"1.0.0-1","helmChartVersionLatest":"1.0.0-1.prod","namespace":"devops-prod"}}'
          echo "$LISTA_APPS" | jq -r '.[] | "\(.appName)\t\(.teamProject)\t\(.environment)\t\(.appVersion)\t\(.helmChartVersionLatest)\t\(.namespace)"' | while IFS=$'\t' read -r appName teamProject environment appVersion helmChartVersionLatest namespace; do
            applicationName=$teamProject-$appName-$environment
            echo "Desplegando $appName $teamProject $environment $appVersion $helmChartVersionLatest $namespace"
            sleep 5
            echo "-.............-"
          done





name: 'Validate PreProd With Sentinel'
description: 'Actin to Validate Project'
inputs:
  branch:
    description: "Branch Analysis"
    required: false
    default: "main"
  scan_id:
    description: "ScanId para consultar el Quality Gate en la API Sentinel"
    required: true
  sentinel_url:
    description: "URL base de la API de Sentinel (sin trailing slash)"
    required: false
    default: "https://github-integration-gitops-prod.apps.andreani.com.ar"

runs:
  using: "composite"
  steps:
    - name: Key Repository
      uses: actions/github-script@v8
      with:
        script: |
          const name = context.repo.repo
          const organization = context.repo.owner
          core.exportVariable('KEY_REPOSITORY', `${organization}_${name}`)
    - name: Validate
      shell: bash
      run: |
        REPO_ID="${{ github.repository_id }}"
    
        SENTINEL_URL="${{ inputs.sentinel_url }}/api/v1/scans/repository/${REPO_ID}/validation"
    
        echo "🔗 URL de validación: ${SENTINEL_URL}"
    
        RETRY_WAIT=5
        MAX_RETRIES=5
        RETRY_COUNT=0
    
        while true; do
          echo "🔍 Consultando Sentinel API..."
    
          HTTP_STATUS=$(curl \
            --silent \
            --output /dev/null \
            --write-out "%{http_code}" \
            -X GET \
            "$SENTINEL_URL"
          )
    
          echo "📡 HTTP Status recibido: $HTTP_STATUS"
    
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "✅ Quality Gate passed."
            exit 0
    
          elif [ "$HTTP_STATUS" -eq 409 ]; then
            echo "❌ Quality Gate failed."
            echo "⛔ La API Sentinel respondió con 409: el análisis no superó el Quality Gate."
            exit 1
    
          elif [ "$HTTP_STATUS" -eq 204 ]; then
            if [ "$RETRY_COUNT" -ge "$MAX_RETRIES" ]; then
              echo "❌ Se alcanzó el máximo de ${MAX_RETRIES} reintentos."
              echo "⛔ Sentinel todavía no devolvió un resultado para el Quality Gate."
              exit 0
            fi
    
            RETRY_COUNT=$((RETRY_COUNT + 1))
    
            echo "⏳ La API Sentinel respondió con 204 (sin resultado aún)."
            echo "🔄 Reintento ${RETRY_COUNT}/${MAX_RETRIES} en ${RETRY_WAIT}s..."
    
            sleep "$RETRY_WAIT"
    
          else
            echo "❌ Respuesta inesperada de la API Sentinel: HTTP $HTTP_STATUS"
            echo "⛔ Se interrumpe el pipeline por error desconocido."
            exit 1
          fi
        done

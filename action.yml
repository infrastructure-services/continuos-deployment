name: Generic Helm Pack and Push to Private ECR
description: Pack Helm chart and push it to private Amazon ECR

inputs:
  ECR_ID:
    description: AWS Access Key ID del usuario de CI/CD
    required: true

  ECR_PASSWORD:
    description: AWS Secret Access Key del usuario de CI/CD
    required: true

  ECR_FULLNAME:
    description: Registry privado, por ejemplo 240229583996.dkr.ecr.us-east-1.amazonaws.com
    required: true

  AWS_REGION:
    description: Región de AWS donde está ECR
    required: false
    default: us-east-1

  appName:
    description: "Nombre de la aplicacion (dentro del proyecto)"
    required: true

  namespace:
    description: "Nombre de namespace"
    required: false
    default: ""

  teamProject:
    description: "Nombre del proyecto/equipo"
    required: true

  appVersion:
    description: "Tag para subir imagen"
    required: true

  helmChartVersionLatest:
    description: Versión del chart Helm
    required: true

runs:
  using: composite

  steps:
    #########################################################
    # INIT
    #########################################################

    - name: Inicia el proceso
      shell: bash
      run: echo "Inicia el proceso de empaquetado Helm"


    #########################################################
    # HELM
    #########################################################

    - name: Install Helm
      uses: azure/setup-helm@v5
      with:
        version: v3.12.3


    - name: Reviso archivos y version helm
      shell: bash
      run: |
        set -euo pipefail

        ls -la
        helm version --short


    #########################################################
    # VALUES
    #########################################################

    - name: Descargar artefacto de values
      uses: actions/download-artifact@v8
      with:
        name: ${{ inputs.appName }}-${{ inputs.namespace }}


    #########################################################
    # HELM LINT
    #########################################################

    - name: Helm Lint
      shell: bash
      run: |
        set -euo pipefail

        helm lint \
          --values values.yaml \
          .


    #########################################################
    # AWS CREDENTIALS
    #########################################################

    - name: Configurar credenciales AWS
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.ECR_ID }}
        aws-secret-access-key: ${{ inputs.ECR_PASSWORD }}
        aws-region: ${{ inputs.AWS_REGION }}


    #########################################################
    # HELM PACKAGE + PUSH
    #########################################################

    - name: Helm Package and Push to Private ECR
      shell: bash
      env:
        AWS_REGION: ${{ inputs.AWS_REGION }}
        ECR_FULLNAME: ${{ inputs.ECR_FULLNAME }}

        TEAM_PROJECT: ${{ inputs.teamProject }}
        APP_NAME: ${{ inputs.appName }}

        HELM_VERSION: ${{ inputs.helmChartVersionLatest }}
        APP_VERSION: ${{ inputs.appVersion }}

      run: |
        set -euo pipefail

        #####################################################
        # GENERATE REPOSITORY INFORMATION
        #####################################################

        CHART_NAME="${TEAM_PROJECT}-${APP_NAME}"

        HELM_NAMESPACE="helm"

        HELM_REPOSITORY="${HELM_NAMESPACE}/${CHART_NAME}"

        HELM_PUSH_URL="oci://${ECR_FULLNAME}/${HELM_NAMESPACE}"

        echo "=========================================="
        echo "Helm Package"
        echo "=========================================="
        echo "Chart name      : $CHART_NAME"
        echo "Helm version    : $HELM_VERSION"
        echo "App version     : $APP_VERSION"
        echo "ECR registry    : $ECR_FULLNAME"
        echo "ECR repository  : $HELM_REPOSITORY"
        echo "Helm push URL   : $HELM_PUSH_URL"
        echo "=========================================="


        #####################################################
        # AWS IDENTITY
        #####################################################

        echo "Identidad AWS:"

        aws sts get-caller-identity


        #####################################################
        # ENSURE HELM ECR REPOSITORY EXISTS
        #####################################################

        echo "Validando repositorio Helm:"
        echo "$HELM_REPOSITORY"

        if aws ecr describe-repositories \
          --repository-names "$HELM_REPOSITORY" \
          --region "$AWS_REGION" \
          >/dev/null 2>&1; then

          echo "Repositorio Helm existente: $HELM_REPOSITORY"

        else

          echo "Repositorio Helm no existe."
          echo "Creando: $HELM_REPOSITORY"

          aws ecr create-repository \
            --repository-name "$HELM_REPOSITORY" \
            --region "$AWS_REGION" \
            --image-scanning-configuration scanOnPush=true \
            >/dev/null

          echo "Repositorio Helm creado correctamente"

        fi


        #####################################################
        # LOGIN PRIVATE ECR
        #####################################################

        echo "Login en ECR privado: $ECR_FULLNAME"

        aws ecr get-login-password \
          --region "$AWS_REGION" |
          helm registry login \
            "$ECR_FULLNAME" \
            --username AWS \
            --password-stdin


        #####################################################
        # HELM PACKAGE
        #####################################################

        PACKAGE_DIR="$(mktemp -d)"

        echo "Empaquetando Helm chart..."

        helm package . \
          --destination "$PACKAGE_DIR" \
          --version "$HELM_VERSION" \
          --app-version "$APP_VERSION"


        #####################################################
        # FIND PACKAGE
        #####################################################

        CHART_PACKAGE="$(find \
          "$PACKAGE_DIR" \
          -maxdepth 1 \
          -name '*.tgz' \
          -type f \
          -print \
          -quit)"

        if [[ -z "$CHART_PACKAGE" ]]; then

          echo "::error::No se generó ningún paquete Helm .tgz"
          exit 1

        fi

        echo "Paquete generado:"
        echo "$CHART_PACKAGE"


        #####################################################
        # HELM PUSH
        #####################################################

        echo "Publicando chart..."
        echo "Package: $CHART_PACKAGE"
        echo "Destino: $HELM_PUSH_URL"

        helm push \
          "$CHART_PACKAGE" \
          "$HELM_PUSH_URL"

        echo "::notice::Helm Chart publicado: ${HELM_REPOSITORY}:${HELM_VERSION}"


        #####################################################
        # FINISH
        #####################################################

        echo "=========================================="
        echo "✅ Helm Chart publicado correctamente"
        echo "=========================================="
        echo "Repository : $HELM_REPOSITORY"
        echo "Version    : $HELM_VERSION"
        echo "=========================================="
name: "Build iOS"
description: "Unique step to Build iOS"
inputs:
  # App
  appName:
    description: "Nombre de la aplicacion (dentro del proyecto)"
    required: true
  appVersion:
    description: "tag para subir imagen"
    required: true
  environment:
    description: "nombre de environment"
    required: false
    default: ""
  isProd:
    description: "si es produccion"
    required: false
    default: "false"
  # Build React
  matrix_version:
    description: "matrix de pruebas node"
    required: true
  fontawesome_token:
    description: "token de fontawesome"
    required: false
    default: ""
  packages_token:
    description: "token github para autenticarse en packages"
    required: false
    default: ""
  # Build iOS
  xcode_version:
    description: "version de Xcode a utilizar"
    required: false
    default: "latest-stable"
  scheme:
    description: "scheme de Xcode a compilar"
    required: true
  workspace:
    description: "workspace de Xcode (.xcworkspace) generado por CocoaPods"
    required: false
    default: ""
  project_path:
    description: "ruta relativa a la carpeta ios"
    required: false
    default: "ios"
  export_method:
    description: "metodo de exportacion del ipa (app-store, ad-hoc, enterprise, development)"
    required: false
    default: "app-store"
  IOS_CERTIFICATE_P12:
    description: "certificado de firma (.p12) en base64"
    required: true
  IOS_CERTIFICATE_PASSWORD:
    description: "password del certificado .p12"
    required: true
  IOS_PROVISIONING_PROFILE:
    description: "provisioning profile (.mobileprovision) en base64"
    required: true
  IOS_TEAM_ID:
    description: "Apple Developer Team ID"
    required: true
  KEYCHAIN_PASSWORD:
    description: "password temporal para el keychain creado en el runner"
    required: false
    default: "temp-keychain-password"

outputs:
  name_environment:
    description: "Nombre del environment"
    value: ${{ steps.setOutputs.outputs.environment }}
  artifact_name:
    description: "URL del environment"
    value: ${{ steps.setOutputs.outputs.artifact_name }}

runs:
  using: "composite"
  steps:
    - run: echo Deploy ${{ inputs.environment }}
      shell: bash

    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set Outputs
      id: setOutputs
      shell: bash
      run: |
        echo "environment=${{ inputs.environment }}" >> $GITHUB_OUTPUT
        echo "artifact_name=${{ inputs.appName }}-${{ inputs.environment }}" >> $GITHUB_OUTPUT
        # si es prod el nombre se mantiene, si no es prod se le agrega el environment
        if [ "${{ inputs.isProd }}" == "false" ]; then
          echo "internal_name=[${{ inputs.environment }}] ${{ inputs.appName }}" >> $GITHUB_OUTPUT
        else
          echo "internal_name=${{ inputs.appName }}" >> $GITHUB_OUTPUT
        fi

    - name: Select Xcode version
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: ${{ inputs.xcode_version }}

    - uses: architecture-it/actions@react-base-library
      with:
        matrix_version: ${{ inputs.matrix_version }}
        # secrets enabled in all organizations
        packages_token: ${{ inputs.packages_token }}
        fontawesome_token: ${{ inputs.fontawesome_token }}

    - name: Install CocoaPods
      shell: bash
      run: gem install cocoapods

    - name: Cache CocoaPods
      uses: actions/cache@v4
      with:
        path: ${{ inputs.project_path }}/Pods
        key: ${{ runner.os }}-pods-${{ hashFiles(format('{0}/Podfile.lock', inputs.project_path)) }}
        restore-keys: |
          ${{ runner.os }}-pods-

    - name: Pod Install
      shell: bash
      run: |
        cd ${{ inputs.project_path }}
        pod install --repo-update

    - name: Import Code-Signing Certificates
      shell: bash
      env:
        IOS_CERTIFICATE_P12: ${{ inputs.IOS_CERTIFICATE_P12 }}
        IOS_CERTIFICATE_PASSWORD: ${{ inputs.IOS_CERTIFICATE_PASSWORD }}
        KEYCHAIN_PASSWORD: ${{ inputs.KEYCHAIN_PASSWORD }}
      run: |
        KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
        CERTIFICATE_PATH=$RUNNER_TEMP/certificate.p12

        echo -n "$IOS_CERTIFICATE_P12" | base64 --decode -o $CERTIFICATE_PATH

        security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

        security import $CERTIFICATE_PATH -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
        security list-keychain -d user -s $KEYCHAIN_PATH

    - name: Install Provisioning Profile
      shell: bash
      env:
        IOS_PROVISIONING_PROFILE: ${{ inputs.IOS_PROVISIONING_PROFILE }}
      run: |
        PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
        echo -n "$IOS_PROVISIONING_PROFILE" | base64 --decode -o $PROFILE_PATH

        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: Bump version
      shell: bash
      run: |
        cd ${{ inputs.project_path }}
        agvtool new-marketing-version ${{ inputs.appVersion }}
        agvtool new-version -all ${{ github.run_number }}

    - name: Archive App
      shell: bash
      env:
        ENVFILE: .env.${{ inputs.environment }}
        APP_SUFFIX: ${{ inputs.environment }}
        APP_NAME: ${{ steps.setOutputs.outputs.internal_name }}
      run: |
        cd ${{ inputs.project_path }}
        WORKSPACE="${{ inputs.workspace }}"
        if [ -z "$WORKSPACE" ]; then
          WORKSPACE=$(ls -d *.xcworkspace | head -n 1)
        fi

        xcodebuild archive \
          -workspace "$WORKSPACE" \
          -scheme "${{ inputs.scheme }}" \
          -configuration Release \
          -archivePath "$RUNNER_TEMP/app.xcarchive" \
          -destination "generic/platform=iOS" \
          DEVELOPMENT_TEAM="${{ inputs.IOS_TEAM_ID }}" \
          CODE_SIGN_STYLE="Manual"

    - name: Export IPA
      shell: bash
      run: |
        cd ${{ inputs.project_path }}
        cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>${{ inputs.export_method }}</string>
          <key>teamID</key>
          <string>${{ inputs.IOS_TEAM_ID }}</string>
          <key>signingStyle</key>
          <string>manual</string>
          <key>compileBitcode</key>
          <false/>
        </dict>
        </plist>
        EOF

        xcodebuild -exportArchive \
          -archivePath "$RUNNER_TEMP/app.xcarchive" \
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
          -exportPath "$RUNNER_TEMP/export"

    - name: Rename IPA
      shell: bash
      run: |
        mkdir -p ${{ inputs.project_path }}/build/outputs/ipa
        IPA_FILE=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
        cp "$IPA_FILE" ${{ inputs.project_path }}/build/outputs/ipa/app-release-signed.ipa

    - run: cd ${{ inputs.project_path }}/build/outputs/ipa && ls -la
      shell: bash

    # Upload to Artifact
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.setOutputs.outputs.artifact_name }}
        path: ${{ inputs.project_path }}/build/outputs/ipa/app-release-signed.ipa

    - name: Clean up Keychain and Provisioning Profile
      if: always()
      shell: bash
      run: |
        security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
        rm -f ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision || true

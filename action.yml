name: "Generate Release"

description: "Action to generate release after a successful deploy to prod"

inputs:
  #########################################################
  # AWS ECR
  #########################################################

  ECR_ID:
    description: "AWS Access Key ID"
    required: true

  ECR_PASSWORD:
    description: "AWS Secret Access Key"
    required: true

  awsRegion:
    description: "Región de AWS"
    required: false
    default: "us-east-1"

  #########################################################
  # APP
  #########################################################

  appName:
    description: "Nombre de la aplicacion (dentro del proyecto)"
    required: true

  teamProject:
    description: "Nombre del proyecto/equipo"
    required: true

  appVersion:
    description: "Tag de la imagen generada durante el build"
    required: true

  matrix_deploy:
    description: "Deploy en multiples aplicaciones"
    required: false
    default: "[]"

  #########################################################
  # GITHUB
  #########################################################

  github_token:
    description: "GitHub Token"
    required: true

  #########################################################
  # JIRA INTEGRATION
  #########################################################

  jira_project_id:
    description: 'Jira Project Id (e.g. "PE20")'
    required: false
    default: " "

  jira_api_token:
    description: "Jira API Token"
    required: false
    default: " "

  jira_email:
    description: "Jira Email"
    required: false
    default: " "

  #########################################################
  # FUTURAS NOTIFICACIONES
  #########################################################

  webhook_url_teams:
    description: "URL del Team en que se publica la notificacion"
    required: false
    default: " "

runs:
  using: "composite"

  steps:
    #########################################################
    # CHECKOUT
    #########################################################

    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0


    #########################################################
    # SEMANTIC BRANCH
    #########################################################

    - name: Configure semantic branches
      id: semanticBranches
      shell: bash
      env:
        BRANCH_NAME: ${{ github.ref_name }}
      run: |
        set -euo pipefail

        echo "The branch name is $BRANCH_NAME"

        if [[ "$BRANCH_NAME" == "main" ]]; then
          echo 'configureBranch=["main"]' >> "$GITHUB_OUTPUT"
        else
          echo "configureBranch=[\"main\", {\"name\": \"$BRANCH_NAME\", \"prerelease\": \"$BRANCH_NAME\" }]" >> "$GITHUB_OUTPUT"
        fi


    #########################################################
    # JIRA + GENERATE RELEASE VERSION
    #########################################################

    - name: 📑Jira integration
      id: version
      uses: architecture-it/actions@next-version
      with:
        github_token: ${{ inputs.github_token }}
        only_version: 'false'
        jira_release_name: ${{ inputs.teamProject }}-${{ inputs.appName }}
        branches: ${{ steps.semanticBranches.outputs.configureBranch }}

    #########################################################
    # AWS CREDENTIALS
    #########################################################

    - name: Configure AWS Credentials
      if: ${{ steps.version.outputs.new-version != '' }}
      uses: aws-actions/configure-aws-credentials@v6
      with:
        aws-access-key-id: ${{ inputs.ECR_ID }}
        aws-secret-access-key: ${{ inputs.ECR_PASSWORD }}
        aws-region: ${{ inputs.awsRegion }}


    #########################################################
    # LOGIN ECR
    #########################################################

    - name: Login to Amazon ECR
      if: ${{ steps.version.outputs.new-version != '' }}
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2


    #########################################################
    # PULL + TAG + PUSH
    #########################################################

    - name: Pull-Tag-Push imagen
      if: ${{ steps.version.outputs.new-version != '' }}
      id: pullImage
      shell: bash
      env:
        REGISTRY: ${{ steps.login-ecr.outputs.registry }}

        TEAM_PROJECT: ${{ inputs.teamProject }}
        APP_NAME: ${{ inputs.appName }}

        APP_VERSION: ${{ inputs.appVersion }}
        NEW_VERSION: ${{ steps.version.outputs.new-version }}

        MATRIX_DEPLOY: ${{ inputs.matrix_deploy }}
      run: |
        set -euo pipefail

        echo "=========================================="
        echo "Generando Release"
        echo "=========================================="
        echo "Version build  : $APP_VERSION"
        echo "Version release: $NEW_VERSION"
        echo "Registry       : $REGISTRY"
        echo "=========================================="

        IFS=',' read -r -a deployments <<< "$MATRIX_DEPLOY"

        deployments=($(for deployment in "${deployments[@]}"; do
          echo "$deployment" | xargs | sed 's/[][]//g'
        done))


        #####################################################
        # SINGLE APPLICATION
        #####################################################

        if [[ ${#deployments[@]} -eq 0 ]]; then

          REPOSITORY_NAME="${TEAM_PROJECT}-${APP_NAME}"

          SOURCE_IMAGE="${REGISTRY}/${REPOSITORY_NAME}:${APP_VERSION}"
          RELEASE_IMAGE="${REGISTRY}/${REPOSITORY_NAME}:${NEW_VERSION}"

          echo "Imagen origen:"
          echo "$SOURCE_IMAGE"

          echo "Imagen release:"
          echo "$RELEASE_IMAGE"

          echo "Pull image..."

          docker pull "$SOURCE_IMAGE"

          echo "Tag image..."

          docker tag \
            "$SOURCE_IMAGE" \
            "$RELEASE_IMAGE"

          echo "Push release image..."

          docker push "$RELEASE_IMAGE"

          echo "::notice::Image name: $RELEASE_IMAGE"


        #####################################################
        # MULTIPLE APPLICATIONS
        #####################################################

        else

          for deployment in "${deployments[@]}"; do

            REPOSITORY_NAME="${TEAM_PROJECT}-${APP_NAME}-${deployment}"

            SOURCE_IMAGE="${REGISTRY}/${REPOSITORY_NAME}:${APP_VERSION}"
            RELEASE_IMAGE="${REGISTRY}/${REPOSITORY_NAME}:${NEW_VERSION}"

            echo "------------------------------------------"
            echo "Deployment: $deployment"
            echo "Imagen origen : $SOURCE_IMAGE"
            echo "Imagen release: $RELEASE_IMAGE"
            echo "------------------------------------------"

            echo "Pull image..."

            docker pull "$SOURCE_IMAGE"

            echo "Tag image..."

            docker tag \
              "$SOURCE_IMAGE" \
              "$RELEASE_IMAGE"

            echo "Push release image..."

            docker push "$RELEASE_IMAGE"

            echo "::notice::Image name: $RELEASE_IMAGE"

          done

        fi


    #########################################################
    # FINISH
    #########################################################

    - name: Finish
      shell: bash
      env:
        APP_VERSION: ${{ inputs.appVersion }}
        NEW_VERSION: ${{ steps.version.outputs.new-version }}
      run: |
        echo "=========================================="
        echo "✅ Release completado correctamente"
        echo "=========================================="
        echo "Version Build   : $APP_VERSION"
        echo "Version Release : $NEW_VERSION"
        echo "=========================================="
